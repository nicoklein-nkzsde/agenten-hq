<html lang="de">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenten HQ</title>
<meta name="description" content="Nicos Agenten-Hochhaus – live vom MacBook.">
<meta name="theme-color" content="#0e0b1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{
  --ink:#0e0b1a; --ink2:#15112a; --ink3:#1f1838;
  --hi:#3d3170; --lo:#07050f; --cream:#f2e6c9;
  --gold:#ffcc33; --red:#ff4f6d; --cyan:#5ad1ff; --green:#4dff8a; --muted:#8b84a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ink)}
body{
  color:var(--cream);font-family:'VT323',monospace;font-size:20px;line-height:1.1;min-height:100vh;
  padding:max(10px,env(safe-area-inset-top)) 12px max(20px,env(safe-area-inset-bottom));
  background-color:var(--ink);
  background-image:
    linear-gradient(45deg,#120e22 25%,transparent 25%,transparent 75%,#120e22 75%),
    linear-gradient(45deg,#120e22 25%,transparent 25%,transparent 75%,#120e22 75%);
  background-size:8px 8px;background-position:0 0,4px 4px;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* Pixel-Rahmen: abgestufte Ecken + Relief */
.px{
  background:var(--ink2);position:relative;
  box-shadow:
    -4px 0 0 0 var(--lo), 4px 0 0 0 var(--lo), 0 -4px 0 0 var(--lo), 0 4px 0 0 var(--lo),
    inset 3px 3px 0 0 var(--hi), inset -3px -3px 0 0 #0a0716;
}
.app{max-width:1280px;margin:0 auto}

/* HUD */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;margin:4px 4px 16px}
.logo{font-family:'Press Start 2P';font-size:13px;letter-spacing:1px;white-space:nowrap}
.logo b{color:var(--gold)}
.logo i{font-style:normal;color:var(--red)}
.stats{display:flex;gap:12px;align-items:center;font-family:'Press Start 2P';font-size:9px}
.stat{display:flex;align-items:center;gap:6px;white-space:nowrap}
.led{width:8px;height:8px;background:#3a3350;box-shadow:inset -2px -2px 0 rgba(0,0,0,.35)}
.led.on{background:var(--green);animation:blink 1s steps(2) infinite}
.led.warn{background:var(--gold)} .led.bad{background:var(--red)}
@keyframes blink{50%{opacity:.4}}

.layout{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:980px){.layout{grid-template-columns:minmax(0,1fr) 360px;align-items:start}}

.mapbox{padding:8px;margin:4px}
#map{display:block;width:100%;height:auto;image-rendering:pixelated;cursor:pointer;background:#000}
.hint{font-family:'Press Start 2P';font-size:8px;color:var(--muted);text-align:center;padding:10px 0 2px}

.side{display:flex;flex-direction:column;gap:18px}
.panel{padding:12px 12px 10px;margin:4px}
.ptitle{font-family:'Press Start 2P';font-size:10px;color:var(--gold);margin-bottom:10px;display:flex;justify-content:space-between}
.ptitle span{color:var(--muted)}

#party{list-style:none;display:flex;flex-direction:column;gap:6px}
#party li{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:4px 6px;cursor:pointer}
#party li:hover,#party li:focus-visible{background:var(--ink3);outline:none}
#party canvas{width:40px;height:40px;image-rendering:pixelated;background:var(--ink3);box-shadow:inset 2px 2px 0 #0a0716}
.pn{font-family:'Press Start 2P';font-size:9px;line-height:1.4}
.pa{color:var(--muted);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pa.work{color:var(--green)}
.chip{font-family:'Press Start 2P';font-size:7px;padding:4px 5px;background:#2a2244;color:var(--muted)}
.chip.working{background:#0f3d24;color:var(--green)}
.chip.error{background:#4a0f1c;color:var(--red)}
.chip.stale{background:#4a3a0f;color:var(--gold)}

#log{list-style:none;display:flex;flex-direction:column;gap:4px;min-height:120px}
#log li{font-size:18px;color:#cfc6e8}
#log li time{color:var(--muted);margin-right:6px}
#log li.new{animation:flash .9s steps(3) 1}
@keyframes flash{0%{color:var(--gold)}}

.btn{font-family:'Press Start 2P';font-size:10px;padding:14px 12px;width:calc(100% - 8px);margin:4px;text-align:center;background:#2b2150}
.btn:active{transform:translateY(2px)}
.side div>.btn{flex:1;width:auto}
.btn:hover{background:#352a63}

/* Dialog */
.ov{position:fixed;inset:0;background:rgba(5,3,12,.82);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.ov.open{display:flex}
.ovin{width:min(760px,100%);padding:10px;max-height:calc(100vh - 32px);overflow:auto}
#zoom{display:block;width:100%;height:auto;image-rendering:pixelated;background:#000}
.dlg{padding:14px 12px 6px}
.dlg h3{font-family:'Press Start 2P';font-size:13px;line-height:1.4}
.dlg .role{color:var(--muted);margin:4px 0 10px}
.dlg .now{margin-bottom:6px}
.dlg .now b{font-family:'Press Start 2P';font-size:8px;color:var(--muted);font-weight:normal;margin-right:8px}
.dlg .lore{color:#a79fc6;margin-top:10px;border-top:2px solid #2a2244;padding-top:8px}
.nav{display:flex;gap:10px;padding:8px 4px 4px}
.nav button{flex:1;font-family:'Press Start 2P';font-size:10px;padding:12px;background:#2b2150}
.nav button:hover{background:#352a63}
.cursor{display:inline-block;width:8px;height:14px;background:var(--cream);vertical-align:-2px;margin-left:4px;animation:blink 1s steps(2) infinite}
.note{font-family:'Press Start 2P';font-size:8px;color:var(--gold);padding:8px 12px;margin:0 4px 14px;display:none}
.foot{font-family:'Press Start 2P';font-size:7px;color:#4a4366;text-align:center;margin-top:20px;line-height:1.8}
@media(max-width:420px){.logo{font-size:11px}.stats{gap:9px;font-size:8px}}
</style>
</head>

7:'111001010010010',8:'010101010101010',9:'010101011001110','!':'010010010000010','?':'110001010000010','.':'000000000000010',
',':'000000000010100',':':'000010000010000','-':'000000111000000','%':'101001010100101',"'":'010010000000000',' ':'000000000000000'};
const UML={'Ä':'A','Ö':'O','Ü':'U'};
function text(c,s,x,y,col,sc=1){s=s.toUpperCase().replace(/ß/g,'SS');let cx=x;
 for(const ch of s){const base=UML[ch]||ch;const g=GL[base]||GL['?'];

 return cx-x;}

function walkersUpdate(dt){
 const profW=RTS.professor.state==='working';
 for(const id of STUDENTS){const w=WK[id],r=RTS[id];

function ago(iso){if(!iso)return '—';const s=Math.max(0,(Date.now()-new Date(iso))/1000);if(s<60)return 'gerade eben';if(s<3600)return `vor ${Math.floor(s/60)} Min`;if(s<86400)return `vor ${Math.floor(s/3600)} Std`;const d=Math.floor(s/86400);return d===1?'gestern':`vor ${d} Tagen`;}
function nextRun(p){if(!p)return null;const n=new Date();for(let i=0;i<8;i++){const d=new Date(n);d.setDate(n.getDate()+i);d.setHours(p.h,p.m,0,0);if(d>n&&p.days.includes(d.getDay()))return d;}return null;}
function fmtNext(d){if(!d)return null;const n=new Date(),hm=d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});const dd=Math.round((new Date(d).setHours(0,0,0,0)-new Date(n).setHours(0,0,0,0))/864e5);
 if(dd===0){const m=Math.round((d-n)/6e4);return m<60?`in ${m} Min`:`heute ${hm}`;}if(dd===1)return `morgen ${hm}`;return d.toLocaleDateString('de-DE',{weekday:'long'})+' '+hm;}

  <div class="lore">${esc(a.lore)}</div>`;
}
function step(d){const ids=[...ORDER];const cur=ovMode==='cat'?'sparki':ovMode;let i=(ids.indexOf(cur)+d+ids.length)%ids.length;openOv(ids[i]==='sparki'?'cat':ids[i]);}
document.getElementById('close').onclick=closeOv;document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);
ov.onclick=e=>{if(e.target===ov)closeOv();};
document.addEventListener('keydown',e=>{if(!ovMode)return;if(e.key==='Escape')closeOv();if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);});
document.getElementById('follow').onclick=()=>openOv('cat');document.getElementById('followDog').onclick=()=>openOv('dog');
map.addEventListener('click',e=>{const r=map.getBoundingClientRect(),wx=(e.clientX-r.left)/r.width*WW,wy=(e.clientY-r.top)/r.height*WH;
 if(Math.hypot(wx-cat.x,wy-(cat.y-6))<10){openOv('cat');return;}
 for(const id of ORDER){const o=origin(id);if(wx>=o.x&&wx<o.x+RW(id)&&wy>=o.y-6&&wy<o.y+72){openOv(id==='sparki'?'cat':id);return;}}});

/* ---------- Laden ---------- */
let backoff=0;
async function load(){
 if(DEMO){demo();return;}if(Date.now()<backoff)return;
 try{let r=await fetch(SRC_API,{headers:{Accept:'application/vnd.github.raw+json'},cache:'no-cache'});
  if(r.status===403||r.status===429){backoff=Date.now()+5*60e3;r=await fetch(SRC_RAW+'?t='+Date.now(),{cache:'no-store'});}
  if(!r.ok)throw new Error(r.status);status=await r.json();lastFetch=new Date();fetchErr=null;}
 catch(e){fetchErr=status?'VERBINDUNG KURZ WEG – ZEIGE LETZTEN STAND':'NOCH KEIN STATUS VOM MAC';}
 applyStatus();}
function demo(){const n=new Date().toISOString(),k=Math.floor(Date.now()/12000);
 status={heartbeat:n,agents:{},chat:{working:k%3,lastActive:n}};
 ['chef','leadtracker','autohaus','berater','aufraeumen','kartbahn','professor'].forEach((id,i)=>{const st=((i+k)%4===0)?'working':((i+k)%9===0?'error':'idle');
  status.agents[id]={state:st,text:st==='working'?'Demo: arbeitet an etwas Wichtigem':'Demo: alles erledigt',since:new Date(Date.now()-6e5).toISOString(),lastDone:new Date(Date.now()-i*36e5).toISOString()};});
 lastFetch=new Date();applyStatus();}
load();setInterval(load,DEMO?6000:30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load();});
</script>
